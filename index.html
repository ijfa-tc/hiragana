:root{--paper:#FBFAF5;--sheet:#FFFFFF;--ink:#1F2A3A;--sub:#5D6676;--rule:#E3DCCB;--guide:#D9CFB8;--grid:#E8B4A8;--accent:#2F4B9A;--ok:#2E7D4F;--ng:#B9412E;--hint:#D9772B;--trace:#3A6FD8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;line-height:1.6;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 32px}
h1{font-family:"Klee One","Hiragino Mincho ProN",serif;font-weight:600;font-size:30px;line-height:1.2;margin:8px 0 2px;letter-spacing:.04em}
.id{color:var(--sub);font-size:14px;margin:0}
.lead{margin:14px 0 18px;color:var(--sub);font-size:15px}
.table{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.k{position:relative;aspect-ratio:1;border:1px solid var(--rule);background:var(--sheet);border-radius:6px;font-family:"Klee One",serif;font-size:28px;line-height:1.1;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:0}
.k .r{font-family:"Zen Kaku Gothic New",sans-serif;font-size:12px;color:var(--sub);margin-top:3px;line-height:1}
.rm{font-size:20px;color:var(--sub)}
.tabs{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.tab{font:inherit;font-size:14px;border:1px solid var(--rule);background:var(--sheet);color:var(--sub);border-radius:999px;padding:6px 14px;cursor:pointer;min-height:44px;line-height:1.2}
.tab small{display:block;font-size:11px}
.table.c3{grid-template-columns:repeat(3,minmax(0,1fr));aspect-ratio:auto}
.table.c3 .k{aspect-ratio:auto;height:72px}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.k:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.k.empty{visibility:hidden}
.k .m{position:absolute;right:4px;top:2px;font-size:13px;font-family:"Zen Kaku Gothic New",sans-serif;line-height:1}
.m.p{color:var(--ok)}.m.d{color:var(--sub)}
.legend{margin:14px 0 0;font-size:13px;color:var(--sub)}
.legend b{font-weight:500}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.btn{font:inherit;font-size:15px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:9px 16px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn small{display:block;font-size:11px;color:inherit;opacity:1;line-height:1.2}
.btn .s{color:var(--sub)}.btn.primary .s{color:var(--paper)}
.head{display:flex;align-items:baseline;gap:12px;margin:6px 0 4px}
.big{font-family:"Klee One",serif;font-size:44px;line-height:1}
.cnt{color:var(--sub);font-size:14px}
.msg{min-height:52px;margin:6px 0 10px;font-size:16px}
.msg .s{display:block;font-size:13px;color:var(--sub)}
.msg.ok{color:var(--ok)}.msg.ng{color:var(--ng)}
.pad{width:100%;aspect-ratio:1;display:block;background:var(--sheet);border:1.5px solid var(--grid);border-radius:4px;touch-action:none;user-select:none;-webkit-user-select:none}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.row .btn{flex:1 1 0;text-align:center}
.foot{margin-top:28px;font-size:12px;color:var(--sub)}
.foot a{color:var(--sub)}
.menu{display:flex;flex-direction:column;gap:10px}
.mi{display:flex;align-items:center;gap:16px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:14px 16px;min-height:84px;cursor:pointer}
.mi .g{width:60px;height:60px;flex:none;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--grid);border-radius:6px;font-family:"Klee One",serif;font-size:34px;line-height:1}
.mi .g.sm{font-size:16px}
.mi .t{display:flex;flex-direction:column;flex-grow:1;line-height:1.35}
.mi .t b{font-size:19px;font-weight:500}
.mi .t span{font-size:13px;color:var(--sub)}
.mi .t .p{color:var(--ok)}
.mi:disabled{cursor:default;opacity:.55}
.mi .soon{font-size:12px;color:var(--sub);border:1px solid var(--rule);border-radius:999px;padding:2px 10px;white-space:nowrap}
#home .tabs{margin-top:14px}
.table.kj .k{height:100px}
.table.kj .k .r{margin-top:4px}
.wlist{display:flex;flex-direction:column;gap:8px}
.wb{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:10px 14px;min-height:68px;cursor:pointer}
.wb .t{display:flex;flex-direction:column;flex-grow:1;line-height:1.3}
.wb .w{font-family:"Klee One",serif;font-size:26px}
.wb .r{font-size:13px;color:var(--sub)}
.wb .m{font-size:14px;min-width:16px;text-align:right}
.wrow{display:grid;gap:6px;margin:4px 0 12px}
.wrow svg{width:100%;height:auto;display:block;background:var(--sheet);border:1.5px solid var(--grid);border-radius:4px}
.wrow svg.on{border:2.5px solid var(--accent)}
.bar{flex-wrap:wrap}
.btn .ic{vertical-align:-3px;margin-right:4px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function updCnt(){$("cnt").textContent=(WM?"「"+cur+"」 ":"")+Math.min(k,tmp.length)+" / "+tmp.length+" 画";}
function anim(par,d,dur,delay){const p=mk(par,d),L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;timers.push(setTimeout(()=>{p.style.transition="stroke-dashoffset "+dur+"s linear";p.style.strokeDashoffset=0;},delay));return p;}
function hint(i){$("hint").innerHTML="";const d=DATA[cur].s[i];const p=mk($("hint"),d),L=p.getTotalLength(),dur=Math.max(.5,L/55);p.style.strokeDasharray=L;p.style.strokeDashoffset=L;requestAnimationFrame(()=>requestAnimationFrame(()=>{p.style.transition="stroke-dashoffset "+dur+"s linear";p.style.strokeDashoffset=0;}));timers.push(setTimeout(()=>{$("hint").innerHTML="";busy=false;},dur*1000+700));}
function finish(){if(WM){wmiss+=miss;const L=[...WM.k];drawRow(true);if(wi<L.length-1){busy=true;setMsg("よくできました。次の文字へ","Bagus! Huruf berikutnya.","ok");timers.push(setTimeout(()=>{wi++;cur=L[wi];reset();},700));return;}const pf=wmiss===0;prog[WM.k]=Math.max(prog[WM.k]||0,pf?2:1);save();if(pf)setMsg("◎ ことばが書けました。まちがいなし！","Sempurna, tanpa kesalahan!","ok");else setMsg("○ ことばが書けました。もう一度やって◎をめざしましょう","Selesai. Coba lagi untuk dapat ◎","ok");return;}const perfect=miss===0;prog[cur]=Math.max(prog[cur]||0,perfect?2:1);save();
if(perfect)setMsg("◎ よくできました。まちがいなし！","Sempurna, tanpa kesalahan!","ok");else setMsg("○ クリア。もう一度やって◎をめざしましょう","Selesai. Coba lagi untuk dapat ◎","ok");}
const pad=$("pad");
function pt(e){const m=pad.getScreenCTM().inverse(),p=pad.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(m);return[q.x,q.y];}
pad.addEventListener("pointerdown",e=>{if(BL){if(BL===1){e.preventDefault();pad.setPointerCapture(e.pointerId);braw=[pt(e)];}return;}if(busy||k>=tmp.length)return;e.preventDefault();drawing=true;pad.setPointerCapture(e.pointerId);pts=[pt(e)];$("ink").setAttribute("d","");});
pad.addEventListener("pointermove",e=>{if(BL){if(braw){braw.push(pt(e));$("ink").setAttribute("d","M"+braw.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join("L"));}return;}if(!drawing)return;pts.push(pt(e));$("ink").setAttribute("d","M"+pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join("L"));});
function end(){if(BL){if(!braw)return;const p=braw;braw=null;$("ink").setAttribute("d","");let L=0;for(let i=1;i<p.length;i++)L+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);if(L>=2){bstr.push(p);drawB();}return;}if(!drawing)return;drawing=false;const u=rs(pts);$("ink").setAttribute("d","");if(!u)return;
const n=tmp.length,dk=dist(u,tmp[k]);
if(dk<TH&&ends(u,tmp[k])){mk($("done"),DATA[cur].s[k]);k++;updCnt();if(k>=n)finish();else setMsg((k+1)+"画目をなぞってください","Telusuri goresan ke-"+(k+1),miss?"":"ok");return;}
miss++;busy=true;
if(dist(u,tmp[k].slice().reverse())<TH){setMsg("向きが逆です。オレンジの向きで書きましょう","Arahnya terbalik. Ikuti arah oranye.","ng");hint(k);return;}
for(let j=k+1;j<n;j++){if(dist(u,tmp[j])<TH){setMsg("書き順がちがいます。先に"+(k+1)+"画目です","Urutan salah. Goresan ke-"+(k+1)+" dulu.","ng");hint(k);return;}}
setMsg("もう一度。オレンジの線をよく見てなぞりましょう","Coba lagi. Perhatikan garis oranye.","ng");hint(k);}
pad.addEventListener("pointerup",end);pad.addEventListener("pointercancel",end);
$("demo").onclick=()=>{exitBlind();reset();busy=true;const s=DATA[cur].s;let t=100;$("done").innerHTML="";s.forEach(d=>{const L=(()=>{const p=mk($("hint"),d),l=p.getTotalLength();p.remove();return l})(),dur=Math.max(.5,L/55);anim($("hint"),d,dur,t);t+=dur*1000+350;});setMsg("お手本を見てください","Perhatikan contohnya.");timers.push(setTimeout(()=>{$("hint").innerHTML="";busy=false;k=0;updCnt();setMsg("1画目をなぞってください","Telusuri goresan ke-1");},t+400));};
$("retry").onclick=()=>{if(BL){blindOn();return;}if(WM)openWord(WM);else reset();};
$("blind").onclick=()=>{if(BL===0){blindOn();return;}if(BL===2){exitBlind();reset();return;}if(!bstr.length){setMsg("まだ何も書いていません","Belum ada tulisan.","ng");return;}const keep=tstr;tstr=bstr;window.__SG=$("hint");const r=judge(cur);window.__SG=null;tstr=keep;BL=2;if(!r){setMsg("◎ 正解！見本なしで書けました","Benar! Kamu bisa menulis tanpa contoh.","ok");}else{setMsg("× "+r[0],r[1],"ng");if(r[2]!=null&&bstr[r[2]])$("bbad").innerHTML='<path d="M'+bstr[r[2]].map(q=>q[0].toFixed(1)+","+q[1].toFixed(1)).join("L")+'"/>';$("done").style.opacity=.35;showHintAll();}$("blind").innerHTML='見本を出す<small class="s">Tampilkan contoh</small>';};
$("say").hidden=!("speechSynthesis" in window);
$("say").onclick=()=>{try{const u=new SpeechSynthesisUtterance(WM?WM.k:cur);u.lang="ja-JP";u.rate=0.85;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}};
$("next").onclick=()=>{if(WM){const S=SETS[set].words;const i=S.indexOf(WM);openWord(S[(i+1)%S.length]);return;}const O=orderOf(setOf(cur));const i=O.indexOf(cur);open(O[(i+1)%O.length]);};
$("back").onclick=()=>{clearT();exitBlind();if(!WM){set=setOf(cur);grp=SETS[set].g;}$("practice").hidden=true;$("home").hidden=false;buildTable();};
const TEST_TH=15;let TQ=[],ti=0,tscore=0,twrong=[],tstr=[],traw=null,tdone=false,tend=false;const tpad=$("tpad");
function ptOn(sv,e){const m=sv.getScreenCTM().inverse(),p=sv.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(m);return[q.x,q.y];}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const TL={hira:["ひらがなで書きましょう","Tulis dengan hiragana"],kata:["カタカナで書きましょう","Tulis dengan katakana"],num:["すうじで書きましょう","Tulis angkanya"],kanji:["かんじで書きましょう","Tulis kanjinya"]};
function setMsg2(j,id,cls){const m=$("tmsg");m.className="msg"+(cls?" "+cls:"");m.innerHTML=j+'<span class="s">'+id+"</span>";}
function startTest(){TQ=shuffle(orderOf(set).slice()).slice(0,10);ti=0;tscore=0;twrong=[];tend=false;$("home").hidden=true;$("test").hidden=false;window.scrollTo(0,0);showQ();}
function redrawInk(){$("tink").innerHTML=tstr.map(p=>'<path d="M'+p.map(q=>q[0].toFixed(1)+","+q[1].toFixed(1)).join("L")+'"/>').join("");}
function showQ(){const c=TQ[ti];tstr=[];tdone=false;$("tpad").hidden=false;$("tundo").hidden=false;$("tink").style.opacity=1;$("tink").innerHTML="";$("tans").innerHTML="";$("tcur").setAttribute("d","");$("tprog").textContent=(ti+1)+" / "+TQ.length;const L=TL[grp]||TL.hira;$("tlabel").innerHTML=L[0]+'<span class="s">'+L[1]+"</span>";if(grp==="kanji"){$("tq").textContent=MEAN[c];$("tq2").textContent=ROMA[c];}else{$("tq").textContent=ROMA[c];$("tq2").textContent="";}setMsg2("書き終わったら「答え合わせ」を押してください","Setelah selesai, tekan Periksa.");$("tcheck").innerHTML='答え合わせ<small class="s">Periksa</small>';$("tundo").disabled=false;}
function bbox(a){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;a.forEach(([x,y])=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);});return[x0,y0,x1,y1];}
function judge(c){const T=DATA[c].s.map(d=>{const p=mk(window.__SG||$("tsamp"),d);const a=sample(p);p.remove();return a;});const n=T.length;
if(tstr.length!==n)return["画数がちがいます（正しくは"+n+"画、書いたのは"+tstr.length+"画）","Jumlah goresan salah (seharusnya "+n+")"];
const tb=bbox(T.flat()),ub=bbox(tstr.flat());const ts=Math.max(tb[2]-tb[0],tb[3]-tb[1]),us=Math.max(ub[2]-ub[0],ub[3]-ub[1])||1,sc=ts/us;const tx=(tb[0]+tb[2])/2,ty=(tb[1]+tb[3])/2,ux=(ub[0]+ub[2])/2,uy=(ub[1]+ub[3])/2;
const N=tstr.map(s=>rs(s.map(([x,y])=>[(x-ux)*sc+tx,(y-uy)*sc+ty])));
const dirc=(u,v)=>{const a=[u[31][0]-u[0][0],u[31][1]-u[0][1]],b=[v[31][0]-v[0][0],v[31][1]-v[0][1]],la=Math.hypot(...a),lb=Math.hypot(...b);return lb<3||la<1?1:(a[0]*b[0]+a[1]*b[1])/(la*lb);};
for(let i=0;i<n;i++){const u=N[i];if(!u)return[(i+1)+"画目が短すぎます","Goresan ke-"+(i+1)+" terlalu pendek",i];const di=dist(u,T[i]);let better=-1;for(let q=i+1;q<n;q++){if(dist(u,T[q])<di*0.6&&dist(u,T[q])<TEST_TH){better=q;break;}}if(better>=0)return["書き順がちがいます（"+(i+1)+"画目に"+(better+1)+"画目を書いています）","Urutan salah (goresan ke-"+(i+1)+")",i];if(di<TEST_TH&&dirc(u,T[i])>0.3)continue;
if(dirc(u,T[i])<-0.3||dist(u,T[i].slice().reverse())<TEST_TH)return[(i+1)+"画目の向きが逆です","Arah goresan ke-"+(i+1)+" terbalik",i];
for(let q=0;q<n;q++){if(q!==i&&dist(u,T[q])<TEST_TH)return["書き順がちがいます（"+(i+1)+"画目に"+(q+1)+"画目を書いています）","Urutan salah (goresan ke-"+(i+1)+")",i];}
return[(i+1)+"画目の形がちがいます","Bentuk goresan ke-"+(i+1)+" salah",i];}
return null;}
function showAnswer(c){$("tink").style.opacity=.3;$("tans").innerHTML="";let delay=100;DATA[c].s.forEach(d=>{const p=mk($("tans"),d),L=p.getTotalLength(),dur=Math.max(.4,L/60);p.style.strokeDasharray=L;p.style.strokeDashoffset=L;setTimeout(()=>{p.style.transition="stroke-dashoffset "+dur+"s linear";p.style.strokeDashoffset=0;},delay);delay+=dur*1000+250;});}
function showResult(){tend=true;$("tpad").hidden=true;$("tundo").hidden=true;$("tprog").textContent="";$("tlabel").innerHTML='テストの結果<span class="s">Hasil tes</span>';$("tq").textContent=tscore+" / "+TQ.length;$("tq2").textContent=tscore===TQ.length?"全問正解！":"";if(twrong.length)setMsg2("まちがえた字："+twrong.join("、"),"Huruf yang salah: "+twrong.join(", "),"ng");else setMsg2("◎ すばらしい！","Luar biasa!","ok");$("tcheck").innerHTML='もう一度<small class="s">Ulangi tes</small>';}
tpad.addEventListener("pointerdown",e=>{if(tdone||tend)return;e.preventDefault();tpad.setPointerCapture(e.pointerId);traw=[ptOn(tpad,e)];});
tpad.addEventListener("pointermove",e=>{if(!traw)return;traw.push(ptOn(tpad,e));$("tcur").setAttribute("d","M"+traw.map(q=>q[0].toFixed(1)+","+q[1].toFixed(1)).join("L"));});
function tEnd(){if(!traw)return;const p=traw;traw=null;$("tcur").setAttribute("d","");let L=0;for(let i=1;i<p.length;i++)L+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);if(L<2)return;tstr.push(p);redrawInk();}
tpad.addEventListener("pointerup",tEnd);tpad.addEventListener("pointercancel",tEnd);
$("tundo").onclick=()=>{if(tdone)return;tstr.pop();redrawInk();};
$("tcheck").onclick=()=>{if(tend){startTest();return;}const c=TQ[ti];if(tdone){ti++;if(ti>=TQ.length)showResult();else showQ();return;}if(!tstr.length){setMsg2("まだ何も書いていません","Belum ada tulisan.","ng");return;}
const r=judge(c);tdone=true;$("tundo").disabled=true;if(!r){tscore++;setMsg2("◎ 正解！","Benar!","ok");}else{twrong.push(c);setMsg2("× "+r[0],r[1],"ng");showAnswer(c);}
$("tcheck").innerHTML=ti<TQ.length-1?'次の問題<small class="s">Soal berikutnya</small>':'結果を見る<small class="s">Lihat hasil</small>';};
$("tback").onclick=()=>{$("test").hidden=true;$("home").hidden=false;buildTable();};
$("tsay").hidden=!("speechSynthesis" in window);
$("tsay").onclick=()=>{try{const u=new SpeechSynthesisUtterance(TQ[ti]);u.lang="ja-JP";u.rate=0.85;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}};
$("tstart").onclick=startTest;
buildMenu();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("./sw.js").catch(()=>{});});}</script>
